[project]
name = "prior-art"
version = "0.1.0"
description = "Autoresearch with a literature memory and honest statistics: LLMs propose, deterministic code measures and decides."
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "anthropic>=0.70",
  "streamlit>=1.40",
  "pandas>=2.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prior_art"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
