# One config schema for the whole project (BUILD_PLAN s10). Secrets only via .env.
llm:
  model: claude-opus-5-5          # pinned. Claude 5 IDs are complete as-is (no date suffix exists)
  effort: medium                  # output_config.effort. NOTE: Opus 5.5 rejects temperature/top_p, so
                                  # "temperature 0" from the plan is not expressible; recordings give determinism.
  effort_by_role:                 # cheaper routine roles (B3). Part of the replay key: new sessions only;
    literature: low               # bundles recorded without this block replay with `effort` for every role
    literature_targeted: low
    critic_post: low
    extract: low
    extract_validation: low
    extract_tighten: low
  critic_pre_cap: {confounds: 5, required_controls: 4}   # one line each; recorded bundles had no cap
  concurrency: 5                  # LLM calls issued in parallel (extraction batches, gate dry run, per-cycle
                                  # candidate prep); results are applied in a fixed order. 1 = sequential.
  timeout_s: 120                  # per request; with max_retries 2 a stalled call fails in ~6 min at worst
  max_retries: 2
  max_tokens: 16000
  server_side_fallback: true      # refusal -> API re-runs on a fallback model (beta). Set false to disable.
  price_per_mtok: {input: 4.0, output: 20.0}   # for budget accounting only

budget:                           # hard budgets (SPEC rule 4)
  max_runs: 32                    # ~20 min at ~35 s/run
  max_wall_minutes: 45
  max_llm_cost_usd: 10.0
  max_followup_candidates: 4

lit_search:                       # live literature search (LIT_SEARCH.md). Runs only with --niche.
  max_queries: 12                 # LLM-proposed queries; one deterministic query per runnable change is added
  per_query: 15                   # arXiv results requested per query
  arxiv_min_interval_s: 5.0       # one request at a time; arXiv throttles faster callers with 429
  arxiv_max_retries: 3            # on 429/503: honor Retry-After, else back off 15s -> 45s -> 120s
  max_failed_fraction: 0.1        # > this share of attempted requests failing -> abort, freeze nothing (re-run resumes)
  openalex: true                  # venue / peer-review / citations; contact email from OPENALEX_MAILTO
  openalex_fallback: true         # scout directions: if an arXiv query keeps failing, try OpenAlex search
  min_papers: 10                  # fewer retrieved -> fall back to the curated snapshot only
  t4_threshold: 0.35              # TF-IDF cosine for "possible overlap: unextracted paper"
  validate_extraction: true       # also extract the curated papers and report agreement with the human labels
  max_llm_cost_usd: 3.0

explore:                          # hypothesis engine (NEXT_VERSION.md). Runs with the live search (--niche).
  enabled: true
  scout_directions: [8, 15]
  per_direction_queries: 3
  per_direction_cap: 15
  per_block_direction_cap: 30     # directions tied to a building block: search the runnable methods harder
  max_total_papers: 160           # niche search + scout searches, after dedupe and ranking
  link_threshold: 0.25            # claim<->direction TF-IDF, tune on curated set
  min_shared_mechanisms: 3        # mechanism nodes linked to >= 2 runnable methods; fewer = thin graph, warn after the search
  top_gaps_for_hypotheses: 8
  tighten_queries: 2
  tighten_cap: 10

search_loop:                      # explore cheaply, confirm rigorously, promote (GRAPH_GAPS Part B)
  enabled: true                   # only for sessions whose corpus has scout directions
  explore_seed: 0                 # exploration reuses the incumbent's run on this seed
  explore_k: 6                    # top open gap hypotheses explored per cycle, 1 seed each
  finalists_per_cycle: 2          # best per mechanism cell, then top N by single-seed improvement
  min_finalists: 1                # confirm at least this many even if no single-seed run improved
  cycles: 3                       # the run budget usually stops the session first

seeds:
  baseline: [0, 1, 2, 3, 4]       # noise floor
  paired: [0, 1, 2]               # candidate screening seeds (baseline runs are reused, never re-run)
  extra: [3, 4]                   # used if the pre-registered rule says "extra seeds"

# Versions of the pre-registered rule and the prior-art gate. Recorded in every bundle; replay
# and rederive use the bundle's own versions (bundles without this block are version 1 of both).
#   rule 2 (2026-10-03): HARMFUL also requires every paired seed to be worse (symmetric with PROMISING).
#   gate 2 (2026-10-03): the LLM lists ALL same-comparison claims; code picks the verdict, strongest first.
#   prediction 2 (2026-10-04): combination gaps predict the sum of their components' literature signs
#                              (both + -> +; mixed -> no prediction). explore2 and earlier are prediction 1.
protocol:
  rule_version: 2
  gate_version: 2
  prediction_version: 2

# Pre-registered next-action rule thresholds (BUILD_PLAN s6). Written before the first run.
rule:
  promising_sd: 1.0
  harmful_sd: 1.0

baseline:                         # the immutable baseline ExperimentConfig (defaults live in schemas.py)
  optimizer: adamw
  lr: 0.002
  schedule: cosine
  warmup_frac: 0.05
  norm: layernorm
  norm_position: pre
  activation: gelu
  pos_encoding: learned

profiles:
  # full: the headline profile. A FIXED STEP BUDGET (not wall-clock): every machine sees identical
  # steps and tokens per run, so conclusions do not depend on hardware speed (~30 s on a fast
  # M-series Mac, ~60 s on a slower one). Throughput is logged per run as a separate, secondary metric.
  full:
    device: auto
    deterministic: false
    budget_mode: steps
    max_steps: 2000
    eval_every_steps: 250
    eval_batches: 20
    eval_batch_size: 64
    prewarm_steps: 2
  # smoke: CPU, tiny, step-budgeted, bit-deterministic. Proves the pipeline; NEVER present as results.
  smoke:
    device: cpu
    deterministic: true
    budget_mode: steps
    max_steps: 40
    eval_every_steps: 20
    eval_batches: 4
    eval_batch_size: 16
    prewarm_steps: 1
    baseline_overrides: {n_layer: 2, n_head: 2, n_embd: 32, batch_size: 16, seq_len: 32}
  # rehearse: the whole live pipeline in ~5 minutes (live Claude, real training, 500 steps, one short
  # cycle). A dry run before recording; labeled like smoke and NEVER used for headline numbers.
  rehearse:
    device: auto
    deterministic: false
    budget_mode: steps
    max_steps: 500
    eval_every_steps: 125
    eval_batches: 20
    eval_batch_size: 64
    prewarm_steps: 2

# Config sections a profile overrides for the whole session (the Profile itself is part of every
# run's cache key, so engine settings live here rather than on it).
profile_overrides:
  rehearse:
    search_loop: {explore_k: 3, cycles: 1}

paths:
  data: data/tinyshakespeare.txt
  data_sha256: 86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed
  papers: data/papers.json
  claims: data/claims.json
  fixtures: data/fixtures.json
  niche: niche.yaml
  results: results
  work: work
