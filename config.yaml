# One config schema for the whole project (BUILD_PLAN s10). Secrets only via .env.
llm:
  model: claude-opus-5-5          # pinned. Claude 5 IDs are complete as-is (no date suffix exists)
  effort: medium                  # output_config.effort. NOTE: Opus 5.5 rejects temperature/top_p, so
                                  # "temperature 0" from the plan is not expressible; recordings give determinism.
  max_tokens: 16000
  server_side_fallback: true      # refusal -> API re-runs on a fallback model (beta). Set false to disable.
  price_per_mtok: {input: 4.0, output: 20.0}   # for budget accounting only

budget:                           # hard budgets (SPEC rule 4)
  max_runs: 20
  max_wall_minutes: 45
  max_llm_cost_usd: 10.0
  max_followup_candidates: 2

lit_search:                       # live literature search (LIT_SEARCH.md). Runs only with --niche.
  max_queries: 12                 # LLM-proposed queries; one deterministic query per runnable change is added
  per_query: 15                   # arXiv results requested per query
  arxiv_min_interval_s: 3.0       # arXiv asks for ~1 request / 3 s
  openalex: true                  # venue / peer-review / citations; contact email from OPENALEX_MAILTO
  min_papers: 10                  # fewer retrieved -> fall back to the curated snapshot only
  t4_threshold: 0.35              # TF-IDF cosine for "possible overlap: unextracted paper"
  validate_extraction: true       # also extract the curated papers and report agreement with the human labels
  max_llm_cost_usd: 3.0

seeds:
  baseline: [0, 1, 2, 3, 4]       # noise floor
  paired: [0, 1, 2]               # candidate screening seeds (baseline runs are reused, never re-run)
  extra: [3, 4]                   # used if the pre-registered rule says "extra seeds"

# Pre-registered next-action rule thresholds (BUILD_PLAN s6). Written before the first run.
rule:
  promising_sd: 1.0
  harmful_sd: 1.0

baseline:                         # the immutable baseline ExperimentConfig (defaults live in schemas.py)
  optimizer: adamw
  lr: 0.002
  schedule: cosine
  warmup_frac: 0.05
  norm: layernorm
  norm_position: pre
  activation: gelu
  pos_encoding: learned

profiles:
  # full: the headline profile. A FIXED STEP BUDGET (not wall-clock): every machine sees identical
  # steps and tokens per run, so conclusions do not depend on hardware speed (~30 s on a fast
  # M-series Mac, ~60 s on a slower one). Throughput is logged per run as a separate, secondary metric.
  full:
    device: auto
    deterministic: false
    budget_mode: steps
    max_steps: 2000
    eval_every_steps: 250
    eval_batches: 20
    eval_batch_size: 64
    prewarm_steps: 2
  # smoke: CPU, tiny, step-budgeted, bit-deterministic. Proves the pipeline; NEVER present as results.
  smoke:
    device: cpu
    deterministic: true
    budget_mode: steps
    max_steps: 40
    eval_every_steps: 20
    eval_batches: 4
    eval_batch_size: 16
    prewarm_steps: 1
    baseline_overrides: {n_layer: 2, n_head: 2, n_embd: 32, batch_size: 16, seq_len: 32}

paths:
  data: data/tinyshakespeare.txt
  data_sha256: 86c4e6aa9db7c042ec79f339dcb96d42b0075e16b8fc2e86bf0ca57e2dc565ed
  papers: data/papers.json
  claims: data/claims.json
  fixtures: data/fixtures.json
  niche: niche.yaml
  results: results
  work: work
